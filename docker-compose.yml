# Local development: `docker compose up --build` starts everything (docs/12 §2).
# Ports are bound to this machine only (127.0.0.1).
name: dawalink

x-backend: &backend
  build: ./backend
  environment: &backend-env
    APP_ENV: ${APP_ENV:-local}
    APP_VERSION: ${APP_VERSION:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DEMO_MODE: ${DEMO_MODE:-true}
    WEBSITE_URL: ${WEBSITE_URL:-http://localhost:5173}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 on this machine, because a locally installed PostgreSQL often holds 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once before the services start, exactly like the one-off task in AWS (docs/12 §7).
  prepare-db:
    <<: *backend
    command: ["python", "-m", "dawalink.ops.prepare_db"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      prepare-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    command: ["python", "-m", "dawalink.worker"]
    depends_on:
      prepare-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "dawalink.worker.alive"]
      interval: 30s
      timeout: 5s
      retries: 1

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
